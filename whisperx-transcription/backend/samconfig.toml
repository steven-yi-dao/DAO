version = 0.1

[default.deploy.parameters]
stack_name = "whisperx"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true

# Phase 1/4: deploy with no image — storage, auth, API and Lambdas only.
# Phase 3: redeploy with InferenceImageUri set to light up SageMaker.
# MaxInstances tracks the account's `ml.g4dn.xlarge for endpoint usage` quota,
# which is 1 in us-east-2. Raise both together or autoscaling fails to scale out.
parameter_overrides = "InferenceImageUri=\"\" InstanceType=\"ml.g4dn.xlarge\" MaxInstances=\"1\" AllowedOrigin=\"http://localhost:5173\" UploadRetentionDays=\"7\""
s3_prefix = "whisperx"
image_repositories = []

[default.build.parameters]
cached = true
parallel = true

[default.global.parameters]
region = "us-east-2"
