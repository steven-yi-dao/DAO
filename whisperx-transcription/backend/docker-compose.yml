services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv:ro          # the built SPA
      - caddy_data:/data         # ACME account + certificates
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ${DATA_DIR:-/data}:/data
    env_file: .env
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - ${DATA_DIR:-/data}:/data
    env_file: .env
    # Only the worker gets the GPU; the API never loads a model.
    # Comment this block out to run the whole stack on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  caddy_data:
  caddy_config:
