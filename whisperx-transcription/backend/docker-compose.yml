services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv:ro          # the built SPA
      - caddy_data:/data         # ACME account + certificates
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    # Kept out of .env on purpose: a bcrypt hash contains '$', and compose
    # interpolates the project .env, which would eat it. env_file values are
    # passed through literally. A missing file stops the stack from starting,
    # which is the right failure for the thing holding the front door shut.
    env_file: caddy.env

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ${DATA_DIR:-/data}:/data
    env_file: .env
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - ${DATA_DIR:-/data}:/data
    env_file: .env
    # This file runs on CPU. Only the worker ever uses the GPU, and that
    # reservation lives in docker-compose.gpu.yml so the base stack starts on a
    # host with no nvidia runtime:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # app/transcribe.py picks the device itself, so nothing else changes.

volumes:
  caddy_data:
  caddy_config:
